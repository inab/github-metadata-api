name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [published]

# Publishing a release from a freshly pushed tag fires both the push and the release
# event. Grouping by ref means the second run supersedes the first instead of building
# and pushing the same image twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 24.22.1

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Runs the test suite inside the image, then starts the production image and checks
  # it over HTTP. Needs no credentials and never calls GitHub.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Test the app in its Docker image
        run: npm run test:docker

  build:
    runs-on: ubuntu-latest
    needs: [test, docker]

    # Only tags publish an image. Covers both the tag push and the release event,
    # since github.ref is refs/tags/<tag> for each.
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Resolve version and check it matches the tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: $VERSION"
          echo "tag: $GITHUB_REF_NAME"

          # Check if the version follows Semantic Versioning (MAJOR.MINOR.PATCH)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: The version '$VERSION' in package.json does not follow Semantic Versioning (e.g., 1.0.0)."
            exit 1
          fi

          # The tag is what a human chose; package.json is what ships inside the image.
          # If they disagree, the image would be mislabelled, so stop here.
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag '$GITHUB_REF_NAME' does not match the package.json version '$VERSION'."
            echo "Bump the version in package.json and tag the commit v$VERSION."
            exit 1
          fi

          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and tag Docker image using the version resolved from package.json
      - name: Build and tag Docker image
        run: |
          docker build -t ghcr.io/inab/github-metadata-api:${{ steps.version.outputs.version }} -t ghcr.io/inab/github-metadata-api:latest .

      # Push Docker image to the registry
      - name: Push Docker image
        run: |
          docker push ghcr.io/inab/github-metadata-api:${{ steps.version.outputs.version }}
          docker push ghcr.io/inab/github-metadata-api:latest
